name: Build inferno-oc kernel

on:
  workflow_dispatch:
  push:
    branches: [ inferno-oc ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc "$AGENT_TOOLSDIRECTORY" /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bc bison flex libssl-dev libelf-dev \
            cpio zip unzip curl rsync gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          mkdir -p /opt/tc && cd /opt/tc

          # ZyC clang 12.0.1 — the tree shipping fire-18-11-oc reports
          # "ZyC clang version 12.0.1", so keep the same major version.
          ZYC_TAG=12.0.1-20230207-release
          ZYC_FILE=Clang-12.0.1-20230207.tar.gz
          if ! curl -fsSL -o clang.tar.gz \
                "https://github.com/ZyCromerZ/Clang/releases/download/$ZYC_TAG/$ZYC_FILE"; then
            echo "release asset download failed, falling back to the API asset URL"
            URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                     "https://api.github.com/repos/ZyCromerZ/Clang/releases/tags/$ZYC_TAG" \
                  | grep -o '"browser_download_url": *"[^"]*Clang-12\.0\.1[^"]*\.tar\.gz"' \
                  | head -n1 | sed 's/.*"\(https[^"]*\)"/\1/')
            echo "asset: $URL"
            curl -fsSL -L -o clang.tar.gz "$URL"
          fi
          ls -la clang.tar.gz
          tar -xzf clang.tar.gz
          CLANG_BIN=$(find -L /opt/tc -maxdepth 2 -name clang -type f | head -n1)
          [ -n "$CLANG_BIN" ] || { echo "no clang in archive"; ls -la /opt/tc; ls -la /opt/tc/bin | head -n 30; exit 1; }
          CLANG_DIR=$(dirname "$(dirname "$CLANG_BIN")")
          export PATH="$CLANG_DIR/bin:$PATH"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          clang --version | head -n2
          command -v aarch64-linux-gnu-gcc arm-linux-gnueabi-gcc

      - name: Configure
        run: |
          make O=out ARCH=arm64 fire_defconfig
          # KernelSU + SUSFS: merge the separate fragment into the generated config
          sed -n 's/^\(CONFIG_[A-Z0-9_]*\)=.*/\1/p' arch/arm64/configs/ksu_defconfig > /tmp/ksu.keys
          awk 'NR==FNR {k[$0]=1; next} /^CONFIG_[A-Z0-9_]*=/ || /^# CONFIG_[A-Z0-9_]* is not set/ {split($0,a,"[= ]"); if (a[1] in k) next} {print}' /tmp/ksu.keys out/.config > /tmp/cfg
          cat arch/arm64/configs/ksu_defconfig >> /tmp/cfg
          cp /tmp/cfg out/.config
          make O=out ARCH=arm64 olddefconfig
          grep -E 'CONFIG_KSU(_SUSFS)?=' out/.config || true

      - name: Build
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip \
            LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Pack AnyKernel3 zip (recovery flash)
        run: |
          set -e
          mkdir -p dist/ak3
          # The zip that ships with the device carries Image.gz (or Image.gz-dtb) plus the AK3 tools.
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp -v out/arch/arm64/boot/Image.gz-dtb dist/ak3/
          else
            gzip -9 -c out/arch/arm64/boot/Image > dist/ak3/Image.gz
          fi
          curl -fsSL -o /tmp/ak3.tar.gz https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/ak3.tar.gz -C /tmp
          cp -r /tmp/AnyKernel3-master/tools /tmp/AnyKernel3-master/LICENSE /tmp/AnyKernel3-master/META-INF dist/ak3/
          cat > dist/ak3/anykernel.sh <<'AK'
          # AnyKernel3 Ramdisk Mod Script
          ## AnyKernel setup
          properties() { '
          kernel.string= Inferno OC by mazepaa
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          supported.versions=
          supported.patchlevels=
          '; }
          block=/dev/block/by-name/boot;
          is_slot_device=1;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          ui_print " " "Patching system's build prop for fuse passthrough..."
          patch_prop /system/build.prop "persist.sys.fuse.passthrough.enable" "true"
          set_perm_recursive 0 0 755 644 $ramdisk/*;
          set_perm_recursive 0 0 750 750 $ramdisk/init* $ramdisk/sbin;
          ## boot install
          dump_boot;
          write_boot;
          ## end boot install
          AK
          (cd dist/ak3 && zip -r9 ../inferno-oc-ak3.zip . -x '*.git*')

      - uses: actions/upload-artifact@v4
        with:
          name: inferno-oc-${{ github.sha }}
          path: dist/
          retention-days: 14
